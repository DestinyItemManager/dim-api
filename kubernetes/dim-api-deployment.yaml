apiVersion: v1
kind: Service
metadata:
  name: dim-api
  labels:
    app: dim-api
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      name: dim-api
  selector:
    app: dim-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: dim-api-pdb
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: dim-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dim-api
spec:
  #replicas: 2
  selector:
    matchLabels:
      app: dim-api
  template:
    metadata:
      labels:
        app: dim-api
      annotations:
        'cluster-autoscaler.kubernetes.io/safe-to-evict': 'true'
        kubernetes.io/change-cause: $COMMITHASH
    spec:
      # Prefer spreading pods evenly across nodes so one node failure doesn't take
      # out most of the API. ScheduleAnyway keeps this a soft preference, so it
      # never blocks scheduling or cluster-autoscaler scale-down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: dim-api
      containers:
        - name: dim-api
          image: destinyitemmanager/dim-api:$COMMITHASH
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: '140m'
              memory: '110Mi'
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: dim-api-secret
                  key: pg_password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dim-api-secret
                  key: jwt_secret
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: dim-api-secret
                  key: github_client_secret
            - name: ADMIN_SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: dim-api-secret
                  key: admin_session_secret
          envFrom:
            - configMapRef:
                name: dim-api-config
          ports:
            - containerPort: 3000
              name: dim-api
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: dim-api
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: dim-api
            initialDelaySeconds: 1
            periodSeconds: 5
            failureThreshold: 1
